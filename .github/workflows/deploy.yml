# Deploys the hosted MCP server to its own box (mcp.scrapingdog.com).
#
# Deliberately separate from the API servers: a bug or a memory leak here must
# not be able to take down api.scrapingdog.com, and MCP wants much longer
# timeouts than the REST API does.
#
# Required repository secrets:
#   MCP_SERVER_HOST         the box's hostname or IP
#   MCP_SERVER_USER         ssh user on it (e.g. ubuntu, root, darshan)
#   MCP_SSH_PRIVATE_KEY     a private key whose public half is in that user's
#                           ~/.ssh/authorized_keys
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-mcp
  cancel-in-progress: false

jobs:
  # Build and test once, before the box is touched. A compile error or a broken
  # auth check should never reach production.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run smoke

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    env:
      APP_PORT: "8731"
    steps:
      - name: Check the host is configured
        run: |
          if [ -z "${{ secrets.MCP_SERVER_HOST }}" ]; then
            echo "ERROR: MCP_SERVER_HOST secret is not set"
            exit 1
          fi

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.MCP_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.MCP_SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh "${{ secrets.MCP_SERVER_USER }}@${{ secrets.MCP_SERVER_HOST }}" \
            APP_PORT="$APP_PORT" 'bash -s' << 'EOF'
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            APP_DIR="$HOME/Scrapingdog-mcp"

            # First deploy clones; later ones sync to the exact remote state.
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone https://github.com/Darshan972/Scrapingdog-mcp.git "$APP_DIR"
            fi
            cd "$APP_DIR"
            git fetch origin
            git checkout -f main
            git reset --hard origin/main
            git clean -fd

            # Pin Node from .nvmrc rather than trusting nvm's default alias.
            nvm install
            nvm use
            echo "Deploying with Node $(node -v)"

            # nvm keeps globals per Node version, so a version bump can leave
            # pm2 off PATH.
            if ! command -v pm2 >/dev/null 2>&1; then
              npm install -g pm2
            fi

            # devDependencies are needed for tsc, so no --omit=dev here.
            npm ci
            npm run build

            pm2 reload ecosystem.config.cjs --update-env || pm2 start ecosystem.config.cjs
            pm2 save

            echo "Waiting for workers to stabilize..."
            sleep 8
            pm2 list

            if pm2 jlist | grep -q '"status":"errored"'; then
              echo "ERROR: a worker is errored"
              pm2 logs scrapingdog-mcp --lines 50 --nostream
              exit 1
            fi

            # "online" only means the process started. Prove it answers, and that
            # an unauthenticated call is still refused - a 200 there would mean
            # the gateway is open to anyone.
            echo "Health check on port ${APP_PORT}..."
            ok=false
            for i in $(seq 1 10); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${APP_PORT}/healthz" || true)
              if [ "$code" = "200" ]; then ok=true; break; fi
              sleep 2
            done
            if [ "$ok" != true ]; then
              echo "ERROR: /healthz did not return 200"
              pm2 logs scrapingdog-mcp --lines 50 --nostream
              exit 1
            fi

            auth=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              -H 'content-type: application/json' -d '{}' \
              "http://127.0.0.1:${APP_PORT}/mcp" || true)
            if [ "$auth" != "401" ]; then
              echo "ERROR: unauthenticated POST /mcp returned $auth, expected 401"
              exit 1
            fi

            echo "Deployed: /healthz 200, unauthenticated /mcp 401"
          EOF
