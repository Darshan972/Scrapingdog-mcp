# TLS front for mcp.scrapingdog.com, using a Cloudflare Origin Certificate.
#
# Kept in its own file rather than commented out inside the main vhost: nginx
# refuses to load a config that names a certificate which is not on disk yet, so
# a conf carrying an inactive TLS block can only ever be enabled by hand-editing
# it on the server. Installed by deploy/enable-tls.sh once the cert exists.
#
# The certificate is issued by Cloudflare's Origin CA, which is trusted by
# Cloudflare and deliberately by nothing else. A browser or curl hitting this
# origin directly will report an untrusted issuer - that is correct.

server {
    # The `http2 on;` directive only exists from nginx 1.25.1. Ubuntu 24.04 ships
    # 1.24.0, where HTTP/2 is enabled on the listen line instead. Newer nginx
    # still accepts this form - it warns that it is deprecated, and loads.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mcp.scrapingdog.com;

    ssl_certificate     /etc/ssl/cloudflare/mcp.scrapingdog.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/mcp.scrapingdog.com.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:MCP_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 4m;

    # As in the HTTP vhost: never add $http_authorization to a log_format here.
    access_log /var/log/nginx/mcp.access.log;
    error_log  /var/log/nginx/mcp.error.log;

    location /healthz {
        proxy_pass http://127.0.0.1:8731;
        access_log off;
    }

    location /mcp {
        proxy_pass http://127.0.0.1:8731;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    location / { return 404 '{"error":"not_found","message":"Try POST /mcp"}'; }
}
