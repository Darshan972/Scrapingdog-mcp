# mcp.scrapingdog.com -> the MCP server on 127.0.0.1:8731
#
# Plain HTTP on purpose. TLS is terminated in front of this box, and this file
# has to LOAD before any certificate exists - an nginx config that names a
# certificate it does not have yet fails `nginx -t`, which blocks the very
# bootstrap that would obtain one.
#
# Two supported ways to get HTTPS in front of it:
#
#   A. Cloudflare (what scrapingdog.com already uses). The record is proxied, so
#      Cloudflare serves the public certificate. Set SSL/TLS mode to "Full
#      (strict)" and install a Cloudflare Origin Certificate on this box, then
#      uncomment the TLS block at the bottom. "Flexible" also works and needs no
#      certificate here, but it leaves Cloudflare->origin traffic in plaintext
#      across the public internet - and that traffic carries customer API keys,
#      so do not stay on Flexible.
#
#   B. Let's Encrypt directly. Set the DNS record to "DNS only" (grey cloud) so
#      the ACME challenge reaches this box, run
#      `sudo certbot --nginx -d mcp.scrapingdog.com`, then re-enable the proxy.
#
# Note there is deliberately NO http->https redirect here. Cloudflare already
# redirects at its edge, and if Cloudflare is talking to this origin over HTTP a
# redirect here would bounce the request back and forth until the client gives up.
#
# Install:
#   sudo cp deploy/nginx/mcp.scrapingdog.com.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/mcp.scrapingdog.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name mcp.scrapingdog.com;

    # MCP request bodies are small; this only has to beat the 4MB the app accepts.
    client_max_body_size 4m;

    # The Authorization header carries the customer's API key. nginx does not log
    # headers by default - keep it that way, and never add $http_authorization to
    # a log_format here.
    access_log /var/log/nginx/mcp.access.log;
    error_log  /var/log/nginx/mcp.error.log;

    # Left in place so option B above works without editing this file.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location /healthz {
        proxy_pass http://127.0.0.1:8731;
        access_log off;
    }

    location /mcp {
        proxy_pass http://127.0.0.1:8731;

        # Streamable HTTP needs HTTP/1.1 upstream and no hop-by-hop Connection
        # header, or a streamed response is held until the request completes.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A tool call is a live scrape: /google with advance_search runs to ~90s
        # and some browser-backed endpoints longer. The default 60s read timeout
        # would 504 the slowest (and most valuable) calls.
        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;

        # Buffering defeats streaming: nginx would hold the whole response and
        # the client would see one late blob instead of progress.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    location / { return 404 '{"error":"not_found","message":"Try POST /mcp"}'; }
}

