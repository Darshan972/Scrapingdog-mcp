# mcp.scrapingdog.com -> the MCP server on 127.0.0.1:8731
#
# Install:
#   sudo cp deploy/nginx/mcp.scrapingdog.com.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/mcp.scrapingdog.com.conf /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d mcp.scrapingdog.com
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name mcp.scrapingdog.com;

    # certbot writes its challenge here before the redirect applies
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mcp.scrapingdog.com;

    # certbot --nginx fills these in
    # ssl_certificate     /etc/letsencrypt/live/mcp.scrapingdog.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/mcp.scrapingdog.com/privkey.pem;

    # MCP request bodies are small; this only has to beat the 4MB the app accepts.
    client_max_body_size 4m;

    # The Authorization header carries the customer's API key. nginx does not log
    # headers by default - keep it that way, and never add $http_authorization to
    # a log_format here.
    access_log /var/log/nginx/mcp.access.log;
    error_log  /var/log/nginx/mcp.error.log;

    location /healthz {
        proxy_pass http://127.0.0.1:8731;
        access_log off;
    }

    location /mcp {
        proxy_pass http://127.0.0.1:8731;

        # Streamable HTTP needs HTTP/1.1 upstream and no hop-by-hop Connection
        # header, or a streamed response is held until the request completes.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A tool call is a live scrape: /google with advance_search runs to ~90s
        # and some browser-backed endpoints longer. The default 60s read timeout
        # would 504 the slowest (and most valuable) calls.
        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;

        # Buffering defeats streaming: nginx would hold the whole response and
        # the client would see one late blob instead of progress.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    location / { return 404 '{"error":"not_found","message":"Try POST /mcp"}'; }
}
